<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AdmAIre · Modello 3D</title>
<meta name="description" content="Modelli 3D: ruota, avvicina, guarda il wireframe.">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<header class="testa">
  <img class="logo" src="logo.svg" alt="" width="60" height="36">
  <div>
    <h1>Adm<span class="ai">AI</span>re</h1>
    <p class="sotto" lang="en">Wear your sight</p>
  </div>
</header>

<main>
  <div id="scena" class="scena" tabindex="0" role="img"
       aria-label="Visualizzatore 3D: un corpo cilindrico con la scritta Chlora e un disco piatto. Usa le frecce per spostarti, + e − per lo zoom, R per ricentrare."></div>
  <p class="stato" id="stato" role="status" aria-live="polite">Carico il modello…</p>
  <p class="aiuto" id="aiuto">Trascina per ruotare · rotella o pizzico per lo zoom · tasto destro o due dita per spostarti</p>
</main>

<nav class="comandi" aria-label="Comandi del modello">
  <div class="gruppo">
    <span class="etichetta">Vista</span>
    <button type="button" id="b-giro" class="icona" aria-pressed="true" title="Rotazione automatica">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>
      <span class="vh" id="t-giro">Ferma la rotazione</span>
    </button>
    <button type="button" id="b-piu" class="icona" title="Avvicina">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M10.5 7.5v6M7.5 10.5h6"/></svg>
      <span class="vh">Avvicina</span>
    </button>
    <button type="button" id="b-meno" class="icona" title="Allontana">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21M7.5 10.5h6"/></svg>
      <span class="vh">Allontana</span>
    </button>
    <button type="button" id="b-reset" class="icona" title="Ricentra la vista">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/><circle cx="12" cy="12" r="2.5"/></svg>
      <span class="vh">Ricentra la vista</span>
    </button>
  </div>

  <fieldset class="gruppo">
    <legend class="etichetta">Modello</legend>
    <div class="scelte" role="radiogroup">
      <label title="Entrambi i modelli, nelle posizioni dei file"><input type="radio" name="disp" value="tutti" checked><span>Tutti</span></label>
      <label title="Corpo cilindrico con la scritta Chlora"><input type="radio" name="disp" value="m1"><span>Corpo</span></label>
      <label title="Disco piatto con incavo"><input type="radio" name="disp" value="m2"><span>Disco</span></label>
    </div>
  </fieldset>

  <fieldset class="gruppo">
    <legend class="etichetta">Superficie</legend>
    <div class="scelte" role="radiogroup">
      <label><input type="radio" name="modo" value="solido" checked><span>Piena</span></label>
      <label><input type="radio" name="modo" value="filo"><span>Wireframe</span></label>
      <label><input type="radio" name="modo" value="misto"><span>Entrambi</span></label>
    </div>
  </fieldset>

  <fieldset class="gruppo" id="g-filo">
    <legend class="etichetta">Colore del filo</legend>
    <div class="colori">
      <label title="Bianco"><input type="radio" name="colore" value="#f4f3ff" checked><i style="--c:#f4f3ff"></i><span class="vh">Bianco</span></label>
      <label title="Petrolio"><input type="radio" name="colore" value="#3fc3dd"><i style="--c:#3fc3dd"></i><span class="vh">Petrolio</span></label>
      <label title="Viola"><input type="radio" name="colore" value="#a98beb"><i style="--c:#a98beb"></i><span class="vh">Viola</span></label>
      <label class="libero" title="Scegli un colore"><input type="color" id="c-libero" value="#ffd27a"><span class="vh">Scegli un colore</span></label>
    </div>
    <label class="opacita">
      <span>Opacità</span>
      <input type="range" id="r-opacita" min="10" max="100" value="80" step="5" aria-valuetext="80 per cento">
    </label>
  </fieldset>
</nav>


<script type="module" src="app.js"></script>
</body>
</html>
